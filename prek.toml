[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-toml" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },

  { id = "detect-private-key" },
  { id = "detect-aws-credentials", args = ["--allow-missing-credentials"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all -- --check", language = "system", types = ["rust"], pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings", language = "system", types = ["rust"], pass_filenames = false },
  { id = "cargo-audit", name = "cargo audit", entry = "cargo audit", language = "system", pass_filenames = false },
]

[package]
name = "glyphst-sync"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["serde"] }
opendal = { version = "=0.59.5", default-features = false, features = [
    "services-s3",
    "services-webdav",
    "layers-retry",
    "http-transport-reqwest",
    "executors-tokio",
], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }
tiny_http = { workspace = true, optional = true }

[features]
# Mirroring the library folder to WebDAV or S3.
remote = ["dep:opendal", "dep:tokio"]
# An in-process S3 for tests, here and in the Reader.
test-support = ["remote", "dep:tiny_http"]

[dev-dependencies]
opendal = { version = "=0.59.5", default-features = false, features = [
    "services-memory",
    "services-fs",
] }

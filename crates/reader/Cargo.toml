[package]
name = "glyphst-reader"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
craft-ui.workspace = true
dirs.workspace = true
eframe = { workspace = true, features = [
    "accesskit",
    "default_fonts",
    # Opens web links (and the ChatGPT sign-in page) in the browser.
    "links",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
egui.workspace = true
egui_commonmark.workspace = true
egui_extras.workspace = true
gilrs.workspace = true
glyphst-agent-host = { path = "../agent-host" }
glyphst-ai = { path = "../ai" }
glyphst-core = { path = "../core" }
glyphst-effects = { path = "../effects" }
glyphst-library = { path = "../library" }
glyphst-pdf = { path = "../pdf" }
glyphst-pdf-gpu = { path = "../pdf-gpu" }
glyphst-pdf-translation-service = { path = "../pdf-translation-service" }
glyphst-settings = { path = "../settings", features = ["keychain"] }
glyphst-translation = { path = "../translation" }
image.workspace = true
mupdf.workspace = true
pollster.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's light/dark choice through the XDG portal (see
# `desktop_theme.rs`). Already in the tree through accesskit and oo7, with
# these features, so nothing is built twice.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
# Blur behind the window through ext-background-effect-v1 on winit's Wayland
# connection (see `window_blur.rs`); the versions and features winit already
# builds.
raw-window-handle = "=0.6.2"
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }

[dev-dependencies]
glyphst-library = { path = "../library", features = ["test-support"] }
glyphst-pdf = { path = "../pdf", features = ["test-support"] }

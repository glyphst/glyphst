[package]
name = "glyphst-reader"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
tracy = ["ztracing/tracy"]

[dependencies]
anyhow.workspace = true
dirs.workspace = true
futures.workspace = true
glyphst-ai = { path = "../ai" }
glyphst-core = { path = "../core" }
glyphst-keymap = { path = "../keymap" }
glyphst-library = { path = "../library", features = ["gpui"] }
glyphst-pdf-translation-service = { path = "../pdf-translation-service" }
glyphst-document-ui = { path = "../document-ui" }
glyphst-settings = { path = "../settings" }
glyphst-settings-ui = { path = "../settings-ui" }
glyphst-translation = { path = "../translation" }
glyphst-translation-ui = { path = "../translation-ui" }
glyphst-ui = { path = "../ui" }
glyphst-workspace = { path = "../workspace" }
gpui = { workspace = true, features = ["bench-support"] }
gpui_component.workspace = true
gpui_platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tikv-jemalloc-sys.workspace = true
tikv-jemallocator.workspace = true
ztracing.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

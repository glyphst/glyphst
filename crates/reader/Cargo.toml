[package]
name = "glyphst-reader"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
eframe = { workspace = true, features = [
    "accesskit",
    # The system clipboard (egui 0.37 made it opt-in).
    "clipboard",
    "default_fonts",
    # Opens web links (and the ChatGPT sign-in page) in the browser.
    "links",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
egui.workspace = true
egui_extras.workspace = true
gilrs.workspace = true
glyphst-agent-host = { path = "../agent-host" }
glyphst-ai = { path = "../ai" }
glyphst-core = { path = "../core" }
glyphst-effects = { path = "../effects" }
glyphst-embed = { path = "../embed" }
glyphst-models = { path = "../models" }
glyphst-ocr = { path = "../ocr" }
glyphst-library = { path = "../library" }
glyphst-markdown = { path = "../markdown" }
glyphst-metadata = { path = "../metadata" }
glyphst-pdf = { path = "../pdf" }
glyphst-pdf-gpu = { path = "../pdf-gpu" }
glyphst-pdf-translation-service = { path = "../pdf-translation-service" }
glyphst-search = { path = "../search" }
glyphst-settings = { path = "../settings", features = ["keychain"] }
glyphst-translation = { path = "../translation" }
glyphst-ui = { path = "../ui" }
glyphst-sync = { path = "../sync", features = ["remote"] }
glyphst-vault = { path = "../vault" }
glyphst-zotero-import = { path = "../zotero-import" }
image.workspace = true
log.workspace = true
mupdf.workspace = true
pollster.workspace = true
regex.workspace = true
reqwest.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
tiny_http.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's light/dark choice through the XDG portal (see
# `desktop_theme.rs`). Already in the tree through accesskit and oo7, with
# these features, so nothing is built twice.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
# Blur behind the window through ext-background-effect-v1 on winit's Wayland
# connection (see `window_blur.rs`); the versions and features winit already
# builds.
raw-window-handle = "=0.6.2"
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Documents and links Finder hands the Reader (see `macos_open.rs`): an
# application delegate on the event loop made in `main.rs`; the versions
# eframe already builds.
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL"] }
winit = { version = "=0.30.13", default-features = false }

[build-dependencies]
# The icon and version resources in glyphst-reader.exe (see `build.rs`); the
# release on the toml 0.8 already in the tree.
winresource = "0.1.23"

[dev-dependencies]
glyphst-library = { path = "../library", features = ["test-support"] }
glyphst-pdf = { path = "../pdf", features = ["test-support"] }
glyphst-search = { path = "../search", features = ["test-support"] }
glyphst-sync = { path = "../sync", features = ["test-support"] }

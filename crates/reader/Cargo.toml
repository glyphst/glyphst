[package]
name = "glyphst-reader"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
craft-ui.workspace = true
dirs.workspace = true
eframe = { workspace = true, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
egui.workspace = true
egui_commonmark.workspace = true
egui_extras.workspace = true
gilrs.workspace = true
glyphst-ai = { path = "../ai" }
glyphst-core = { path = "../core" }
glyphst-effects = { path = "../effects" }
glyphst-library = { path = "../library" }
glyphst-pdf = { path = "../pdf" }
glyphst-pdf-gpu = { path = "../pdf-gpu" }
glyphst-pdf-translation-service = { path = "../pdf-translation-service" }
glyphst-settings = { path = "../settings", features = ["keychain"] }
glyphst-translation = { path = "../translation" }
image.workspace = true
mupdf.workspace = true
pollster.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
wgpu.workspace = true

[dev-dependencies]
glyphst-library = { path = "../library", features = ["test-support"] }
glyphst-pdf = { path = "../pdf", features = ["test-support"] }

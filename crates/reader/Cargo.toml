[package]
name = "glyphst-reader"
version.workspace = true
edition.workspace = true

[features]
tracy = ["ztracing/tracy"]

[dependencies]
anyhow.workspace = true
dirs.workspace = true
futures.workspace = true
glyphst-core = { path = "../core" }
glyphst-keymap = { path = "../keymap" }
glyphst-library = { path = "../library" }
glyphst-pdf-translation-app = { path = "../pdf-translation-app" }
glyphst-document-ui = { path = "../document-ui" }
glyphst-settings = { path = "../settings" }
glyphst-settings-ui = { path = "../settings-ui" }
glyphst-translation = { path = "../translation" }
glyphst-ui = { path = "../ui" }
glyphst-workspace = { path = "../workspace" }
gpui.workspace = true
gpui_component.workspace = true
gpui_platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tikv-jemalloc-sys.workspace = true
tikv-jemallocator.workspace = true
ztracing.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }

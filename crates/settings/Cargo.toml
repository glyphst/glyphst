[package]
name = "glyphst-settings"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# Reads and writes provider secrets in the system credential store, in the
# items the GPUI Reader wrote.
keychain = ["dep:oo7", "dep:pollster"]

[dependencies]
anyhow.workspace = true
glyphst-core = { path = "../core" }
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
kdl.workspace = true
rust-embed.workspace = true
serde_json.workspace = true
uuid.workspace = true
pollster = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { workspace = true, optional = true }

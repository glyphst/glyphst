[package]
name = "glyphst"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
bincode = "1.3"
dirs = "6"
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
image = "0.25"
kdl = "6"
mupdf = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tikv-jemalloc-sys = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }
tikv-jemallocator = { version = "0.7", features = ["background_threads", "override_allocator_on_supported_platforms"] }

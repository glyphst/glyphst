[workspace]
members = [
    "crates/actions",
    "crates/ai",
    "crates/ai-ui",
    "crates/app",
    "crates/core",
    "crates/keymap",
    "crates/library",
    "crates/pdf",
    "crates/pdf-ui",
    "crates/settings",
    "crates/settings-ui",
    "crates/translation",
    "crates/translation-ui",
    "crates/ui",
    "crates/workspace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
bincode = "1.3"
dirs = "6"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "7ed553b391393ee4e62782e710605778e2200a18", package = "gpui", default-features = false, features = [
    "wayland",
    "x11",
] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7ed553b391393ee4e62782e710605778e2200a18", package = "gpui_platform", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }
image = "0.25"
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
kdl = "6"
mupdf = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tikv-jemalloc-sys = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }
tikv-jemallocator = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }

[profile.dev.package.tikv-jemalloc-sys]
opt-level = 2

[workspace]
members = [
    "crates/actions",
    "crates/ai",
    "crates/ai-ui",
    "crates/core",
    "crates/keymap",
    "crates/library",
    "crates/mermaid-render",
    "crates/pdf",
    "crates/pdf-gpu",
    "crates/pdf-translation",
    "crates/pdf-translation-service",
    "crates/document-ui",
    "crates/files",
    "crates/reader",
    "crates/settings",
    "crates/settings-ui",
    "crates/translation",
    "crates/translation-ui",
    "crates/ui",
    "crates/workspace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
chrono = "0.4"
dirs = "6"
futures = "0.3"
gpui = { git = "https://github.com/glyphst/zed", rev = "04a79b674e6c244b1bbf4aa57e7ab2ae28345be0", package = "gpui", default-features = false, features = [
    "wayland",
    "x11",
] }
gpui_component = { git = "https://github.com/glyphst/gpui-kit", rev = "5251bd3978eb4adf2cf9a52e30432a153ba0bdc5", package = "gpui-component" }
gpui_component_assets = { git = "https://github.com/glyphst/gpui-kit", rev = "5251bd3978eb4adf2cf9a52e30432a153ba0bdc5", package = "gpui-kit-assets" }
gpui_fps = { git = "https://github.com/glyphst/gpui-kit", rev = "5251bd3978eb4adf2cf9a52e30432a153ba0bdc5", package = "gpui-fps" }
gpui_platform = { git = "https://github.com/glyphst/zed", rev = "04a79b674e6c244b1bbf4aa57e7ab2ae28345be0", package = "gpui_platform", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }
gpui_wgpu = { git = "https://github.com/glyphst/zed", rev = "04a79b674e6c244b1bbf4aa57e7ab2ae28345be0", package = "gpui_wgpu" }
glyphst-mermaid-render = { path = "crates/mermaid-render" }
glyphst-pdf-engine = { git = "https://github.com/glyphst/glyphst-pdf", rev = "7e0f5c639ffea302288d61c13e9dac38bb869fd3", package = "glyphst-pdf-engine" }
glyphst-pdf-render-cpu = { git = "https://github.com/glyphst/glyphst-pdf", rev = "7e0f5c639ffea302288d61c13e9dac38bb869fd3", package = "glyphst-pdf-render-cpu" }
glyphst-pdf-render-wgpu = { git = "https://github.com/glyphst/glyphst-pdf", rev = "7e0f5c639ffea302288d61c13e9dac38bb869fd3", package = "glyphst-pdf-render-wgpu" }
httpdate = "1"
image = "0.25"
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
kdl = "6"
lsp-types = { version = "0.97", features = ["proposed"] }
markdown = "1.0"
mupdf = "0.7"
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking", "multipart"] }
rand = "0.9"
ratex-layout = "=0.1.9"
ratex-parser = "=0.1.9"
ratex-svg = { version = "=0.1.9", features = ["embed-fonts"] }
ratex-types = "=0.1.9"
regex = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
tikv-jemalloc-sys = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }
tikv-jemallocator = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }
tiny_http = "0.12"
tracing = "0.1"
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = [
    "embedded-fonts",
    "emit-diagnostics",
    "scan-fonts",
] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
zstd = "0.13"
ztracing = { git = "https://github.com/glyphst/zed", rev = "04a79b674e6c244b1bbf4aa57e7ab2ae28345be0" }

[profile.dev.package.tikv-jemalloc-sys]
opt-level = 2

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

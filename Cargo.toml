[workspace]
members = [
    "crates/actions",
    "crates/ai",
    "crates/ai-ui",
    "crates/core",
    "crates/keymap",
    "crates/library",
    "crates/mermaid-render",
    "crates/pdf",
    "crates/pdf-translation",
    "crates/pdf-translation-app",
    "crates/document-ui",
    "crates/files",
    "crates/reader",
    "crates/settings",
    "crates/settings-ui",
    "crates/translation",
    "crates/translation-ui",
    "crates/ui",
    "crates/workspace",
]
exclude = ["dependencies/gpui-component"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
bincode = "1.3"
chrono = "0.4"
dirs = "6"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "4bd1993783703e92affb781503916d1f152f599f", package = "gpui", default-features = false, features = [
    "wayland",
    "x11",
] }
gpui_component = { path = "dependencies/gpui-component/crates/ui", package = "gpui-component" }
gpui_component_assets = { path = "dependencies/gpui-component/crates/assets", package = "gpui-component-assets" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4bd1993783703e92affb781503916d1f152f599f", package = "gpui_platform", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }
glyphst-mermaid-render = { path = "crates/mermaid-render" }
httpdate = "1"
image = "0.25"
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
kdl = "6"
lsp-types = { version = "0.97", features = ["proposed"] }
mupdf = "0.7"
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking", "multipart"] }
rand = "0.9"
ratex-layout = "=0.1.9"
ratex-parser = "=0.1.9"
ratex-svg = { version = "=0.1.9", features = ["embed-fonts"] }
ratex-types = "=0.1.9"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
tikv-jemalloc-sys = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }
tikv-jemallocator = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }
tiny_http = "0.12"
tracing = "0.1"
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = [
    "embedded-fonts",
    "emit-diagnostics",
    "scan-fonts",
] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
ztracing = { git = "https://github.com/zed-industries/zed", rev = "4bd1993783703e92affb781503916d1f152f599f" }

[profile.dev.package.tikv-jemalloc-sys]
opt-level = 2

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

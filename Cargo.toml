[workspace]
members = [
    "crates/actions",
    "crates/ai",
    "crates/ai-ui",
    "crates/app",
    "crates/core",
    "crates/keymap",
    "crates/library",
    "crates/pdf",
    "crates/pdf-translation",
    "crates/pdf-translation-app",
    "crates/pdf-ui",
    "crates/settings",
    "crates/settings-ui",
    "crates/translation",
    "crates/translation-ui",
    "crates/ui",
    "crates/workspace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
bincode = "1.3"
dirs = "6"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", default-features = false, features = [
    "wayland",
    "x11",
] }
gpui_component = { git = "https://github.com/longbridge/gpui-component", rev = "3f9e655e8668fff37df41c541e0d9f3ec992fa7d", package = "gpui-component" }
gpui_component_assets = { git = "https://github.com/longbridge/gpui-component", rev = "3f9e655e8668fff37df41c541e0d9f3ec992fa7d", package = "gpui-component-assets" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }
httpdate = "1"
image = "0.25"
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
kdl = "6"
mupdf = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking", "multipart"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tikv-jemalloc-sys = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }
tikv-jemallocator = { version = "0.7", features = ["override_allocator_on_supported_platforms"] }
tracing = "0.1"
unicode-segmentation = "1"
ztracing = { git = "https://github.com/zed-industries/zed" }

[profile.dev.package.tikv-jemalloc-sys]
opt-level = 2

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

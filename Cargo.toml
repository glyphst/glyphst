[workspace]
members = [
    "crates/agent-host",
    "crates/ai",
    "crates/core",
    "crates/effects",
    "crates/embed",
    "crates/library",
    "crates/markdown",
    "crates/mermaid-render",
    "crates/metadata",
    "crates/models",
    "crates/ocr",
    "crates/pdf",
    "crates/pdf-gpu",
    "crates/pdf-translation",
    "crates/pdf-translation-service",
    "crates/reader",
    "crates/search",
    "crates/settings",
    "crates/sync",
    "crates/translation",
    "crates/ui",
    "crates/vault",
    "crates/zotero-import",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
# Local times of chat messages in the egui Reader (already locked through
# eframe's dependencies); MIT OR Apache-2.0.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytemuck = { version = "1", features = ["derive"] }
dirs = "7"
eframe = { version = "0.37", default-features = false }
egui = "0.37"
# Markdown in the egui Reader's assistant (glyphst-markdown); MIT.
pulldown-cmark = { version = "0.13", default-features = false }
# SVG icons in the egui Reader (resvg); MIT OR Apache-2.0.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
futures = "0.3"
gilrs = "0.11"
httpdate = "1"
# Search vectors stored as float16 (already in the tree); MIT OR Apache-2.0.
half = "2"
image = "0.25"
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
kdl = "6"
log = "0.4"
lyon_tessellation = "1"
# Material You colour schemes from a seed colour or a wallpaper (a port of
# material-color-utilities, as matugen uses); MIT OR Apache-2.0.
material-colors = { version = "0.5", features = ["quantize"] }
# PDF and EPUB only: SVG for EPUB images, system fonts for PDFs that don't
# embed theirs. No OCR (tesseract), JavaScript, XPS, CBZ, image documents or
# DOCX output, which the Reader never uses.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "brotli", "epub", "html", "svg", "system-fonts"] }
redb = "4"
# Pattern search in documents (already in the tree); MIT OR Apache-2.0.
regex = "1"
# arXiv's Atom answers in metadata lookups (already in the tree); MIT OR Apache-2.0.
roxmltree = "0.21"
# Reading a copy of Zotero's database for import, SQLite built in; MIT.
rusqlite = { version = "0.32", features = ["bundled"] }
# Folding titles for duplicate detection (already in the tree); MIT OR Apache-2.0.
unicode-normalization = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "blocking", "multipart", "query", "form"] }
pollster = "0.4"
# The Secret Service keyring (async-io), reading the items GPUI wrote.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
rand = "0.10"
# LaTeX formulas in assistant Markdown, KaTeX-compatible, with the KaTeX
# fonts embedded; MIT.
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
rfd = "0.17"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiny_http = "0.12"
tracing = "0.1"
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = [
    "embedded-fonts",
    "emit-diagnostics",
    "scan-fonts",
] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
url = "2"
wgpu = "30"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

# Hashing a resumed download of a 2 GB model takes minutes unoptimised.
[profile.dev.package.sha2]
opt-level = 3

# Quick to build for local runs: parallel codegen, no cross-crate LTO, and
# only line tables for backtraces.
[profile.release]
debug = "line-tables-only"

# Shipped builds (script/bundle, nix/package.nix).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false
strip = true
# Glyphst's own crates small, as Zed's are: dependencies, and the crates that
# draw, render pages or run models, stay fast.
opt-level = "z"

[profile.dist.package."*"]
opt-level = 3

[profile.dist.package]
glyphst-effects = { opt-level = 3 }
glyphst-ocr = { opt-level = 3 }
glyphst-pdf = { opt-level = 3 }
glyphst-pdf-gpu = { opt-level = 3 }
glyphst-reader = { opt-level = 3 }
glyphst-search = { opt-level = 3 }
glyphst-ui = { opt-level = 3 }

# mupdf-sys 0.8.0 plus MSVC ARM64 and static-CRT builds (Windows on Arm, and
# a Windows executable without the VC++ runtime), from
# glyphst/mupdf-rs@windows-arm64-0.8. Drop it once a mupdf-sys release has
# both.
[patch.crates-io]
mupdf-sys = { git = "https://github.com/glyphst/mupdf-rs", rev = "9975c15f572e9338cad5914a4b1ed398cf9135a5" }

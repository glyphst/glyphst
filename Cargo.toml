[workspace]
members = [
    "crates/agent-host",
    "crates/ai",
    "crates/core",
    "crates/effects",
    "crates/library",
    "crates/mermaid-render",
    "crates/pdf",
    "crates/pdf-gpu",
    "crates/pdf-translation",
    "crates/pdf-translation-service",
    "crates/reader",
    "crates/settings",
    "crates/translation",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
bytemuck = { version = "1", features = ["derive"] }
# Shared egui controls of the Craft apps (tabs, docking, theme helpers); MIT OR Apache-2.0.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
dirs = "7"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
# Markdown in the egui Reader's assistant; MIT OR Apache-2.0.
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }
# SVG icons in the egui Reader (resvg); MIT OR Apache-2.0.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
futures = "0.3"
gilrs = "0.11"
httpdate = "1"
image = "0.25"
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
kdl = "6"
lyon_tessellation = "1"
mupdf = "0.8"
redb = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "blocking", "multipart", "query", "form"] }
pollster = "0.4"
# The Secret Service keyring (async-io), reading the items GPUI wrote.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
rand = "0.10"
rfd = "0.17"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiny_http = "0.12"
tracing = "0.1"
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = [
    "embedded-fonts",
    "emit-diagnostics",
    "scan-fonts",
] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
url = "2"
wgpu = "30"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

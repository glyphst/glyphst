# Linker flags for shipped builds (script/bundle, script/check.sh size):
# cargo --config .cargo/dist.toml build --profile dist. The profile itself is
# in Cargo.toml, so Nix builds share it. RUSTFLAGS would replace these.

# Rust links Linux targets with its own lld. Fold identical functions where
# no code compares their addresses (LLVM's address-significance tables).
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,--icf=safe", "-C", "llvm-args=-addrsig"]

# The C runtime linked in (MuPDF too, through the mupdf-sys patch), so the
# executable runs without the VC++ redistributable. MSVC's linker folds
# identical code in release builds already.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Linker flags for shipped builds (script/bundle, script/check.sh size):
# cargo --config .cargo/dist.toml build --profile dist. The profile itself is
# in Cargo.toml, so Nix builds share it. RUSTFLAGS would replace these.

# Link with lld (Rust's own on x86_64; the system's on aarch64, where Rust
# uses the system linker) and fold identical functions where no code
# compares their addresses (LLVM's address-significance tables).
#
# `-C strip=symbols` because Cargo turns the profile's `strip = true` into
# "debuginfo" as soon as [profile.dist.package] overrides a package, which
# left the symbol table (about 26 MB) in the executables; rustc takes the
# last -C strip, and RUSTFLAGS come after Cargo's.
[target.'cfg(target_os = "linux")']
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,--icf=safe",
    "-C", "llvm-args=-addrsig",
    "-C", "strip=symbols",
]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "strip=symbols"]

# The C runtime linked in (MuPDF too, through the mupdf-sys patch), so the
# executable runs without the VC++ redistributable. MSVC's linker folds
# identical code in release builds already.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
